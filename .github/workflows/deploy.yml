name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  ci:
    name: Run tests
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 120
    env:
      FABRIC_WORKSPACE: ${{ vars.FABRIC_WORKSPACE }}
      FABRIC_ORCHESTRATOR: ${{ vars.FABRIC_ORCHESTRATOR }}
      FABRIC_JOB_TIMEOUT: ${{ vars.FABRIC_JOB_TIMEOUT }}
      FABRIC_SQL_SERVER: ${{ vars.FABRIC_SQL_SERVER }}
      FABRIC_SQL_DATABASE: ${{ vars.FABRIC_SQL_DATABASE }}
      REPORT_TITLE: CI test results

      FAB_SPN_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
      FAB_SPN_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
      FAB_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}

    steps:

      - name: Check out the code
        uses: actions/checkout@v5

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.FAB_SPN_CLIENT_ID }}
          tenant-id: ${{ env.FAB_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Initialize Azure SQL token
        run: |
          az account get-access-token \
            --resource https://database.windows.net/ \
            --output none

      - name: Install Microsoft ODBC Driver 18
        shell: bash
        run: |
          set -euo pipefail
      
          UBUNTU_VERSION=$(. /etc/os-release && echo "$VERSION_ID")
      
          curl -fsSLO "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb"
      
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
      
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      
          odbcinst -q -d
    
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./src/requirements.txt

      - name: Configure Fabric CLI
        shell: bash
        run: |
          set -euo pipefail
          fab config set encryption_fallback_enabled true
          fab config set mode command_line

      - name: Run Fabric CI pipeline
        id: fabric_pipeline
        shell: bash
        run: |
          set -euo pipefail

          ORCHESTRATOR_PATH="${FABRIC_WORKSPACE}.Workspace/${FABRIC_ORCHESTRATOR}.DataPipeline"

          # Run pipeline and preserve the CLI exit code
          FAB_EXIT=0
          JOB_RESULT=$(fab job run "$ORCHESTRATOR_PATH" \
            --timeout "$FABRIC_JOB_TIMEOUT" \
            --polling_interval 30 \
            --json) || FAB_EXIT=$?

          JOB_INSTANCE_ID=$(echo "$JOB_RESULT" | jq -r '.result.data[0].id // empty')
          JOB_STATUS=$(echo "$JOB_RESULT" | jq -r '.status // "Unknown"')
      
          echo "Job Instance ID: $JOB_INSTANCE_ID"
          echo "Job Status: $JOB_STATUS"
      
          # Environment variables for Python
          echo "JOB_INSTANCE_ID=$JOB_INSTANCE_ID" >> "$GITHUB_ENV"
          echo "JOB_STATUS=$JOB_STATUS" >> "$GITHUB_ENV"
      
          # Step outputs for GitHub Actions expressions
          echo "job_instance_id=$JOB_INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "job_status=$JOB_STATUS" >> "$GITHUB_OUTPUT"
      
          exit "$FAB_EXIT"
          
      - name: Generate dbt test report
        if: ${{ always() && steps.fabric_pipeline.outputs.job_instance_id != '' }}
        run: python scripts/report.py --output artifacts/index.html
        
      - name: Upload dbt test report
        if: ${{ always() && steps.fabric_pipeline.outputs.job_instance_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dbt-test-report-${{ steps.fabric_pipeline.outputs.job_instance_id }}
          path: artifacts/index.html
          archive: false
          if-no-files-found: warn
          retention-days: 30
